name: LuckyTool nightly

on:
  schedule:
    - cron: '17 15 * * *' # Every day at 23:17 Asia/Shanghai (UTC+8)
  workflow_dispatch:
    inputs:
      reuse_build_run:
        description: 'Optional: retry publishing an existing successful build run ID'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: luckytool-nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      reuse: ${{ steps.plan.outputs.reuse }}
      artifact_run: ${{ steps.plan.outputs.artifact_run }}
      build_number: ${{ steps.plan.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check upstream and completed releases
        id: plan
        env:
          REUSE_RUN: ${{ inputs.reuse_build_run }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/nightly.py plan

  build:
    needs: check
    if: needs.check.outputs.build == 'true' && needs.check.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact upstream commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: luckyzyx/LuckyTool
          ref: ${{ needs.check.outputs.sha }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Prepare upstream build inputs
        run: python3 scripts/nightly.py prepare
      - name: Build upstream Release APK
        working-directory: upstream
        run: bash ./gradlew :app:assembleRelease --build-cache --no-daemon --stacktrace
      - name: Collect APK and source provenance
        run: python3 scripts/nightly.py collect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-release
          path: artifact/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.build == 'true' && (needs.build.result == 'success' || needs.check.outputs.reuse == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-release
          path: artifact
          run-id: ${{ needs.check.outputs.artifact_run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'build-tools;37.0.0'
      - name: Validate and sign APK on a separate runner
        env:
          BUILD_RUN_NUMBER: ${{ needs.check.outputs.build_number }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: python3 scripts/nightly.py sign
      - name: Publish complete nightly release
        env:
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/nightly.py publish
